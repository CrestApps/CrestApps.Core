name: Publish npm

on:
  workflow_dispatch:
  schedule:
    # 4:29 AM UTC every day (offset from NuGet preview at 4:19).
    - cron: '29 4 * * *'
  push:
    tags:
      - 'v*.*.*'

permissions:
  # Required to mint the short-lived OIDC token for npm trusted publishing.
  id-token: write
  contents: read
  # Required to query previous preview publish runs when deciding whether to publish.
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Publish @crestapps/ai-chat-ui
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Determine what to publish
      id: check-publish
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        $eventName = '${{ github.event_name }}'

        # Release: a version tag was pushed. Publish that version to the 'latest' tag.
        if ($eventName -eq 'push')
        {
          $version = '${{ github.ref_name }}' -replace '^v', ''
          Write-Output "Release tag detected. Publishing version $version to the 'latest' dist-tag."
          "release-mode=true" >> $Env:GITHUB_OUTPUT
          "release-version=$version" >> $Env:GITHUB_OUTPUT
          "should-publish=true" >> $Env:GITHUB_OUTPUT
          exit 0
        }

        # Everything else is a preview publish to the 'preview' dist-tag.
        "release-mode=false" >> $Env:GITHUB_OUTPUT

        if ($eventName -eq 'workflow_dispatch')
        {
          Write-Output 'Manual preview release requested. Publishing unconditionally.'
          "should-publish=true" >> $Env:GITHUB_OUTPUT
          exit 0
        }

        $headers = @{
          Authorization = "Bearer $Env:GITHUB_TOKEN"
          Accept = 'application/vnd.github+json'
          'X-GitHub-Api-Version' = '2022-11-28'
        }

        $workflowRunsUrl = 'https://api.github.com/repos/${{ github.repository }}/actions/workflows/publish_npm.yml/runs?status=success&branch=${{ github.ref_name }}&per_page=20'
        $response = Invoke-RestMethod -Uri $workflowRunsUrl -Headers $headers -Method Get
        $previousRun = $response.workflow_runs |
          Where-Object { $_.id -ne [int64]'${{ github.run_id }}' } |
          Sort-Object created_at -Descending |
          Select-Object -First 1

        if ($null -eq $previousRun)
        {
          Write-Output 'No previous successful preview publish run found. Publishing.'
          "should-publish=true" >> $Env:GITHUB_OUTPUT
          exit 0
        }

        $hasNewCommitSinceLastRelease = $previousRun.head_sha -ne '${{ github.sha }}'
        Write-Output "Last successful preview publish SHA: $($previousRun.head_sha)"
        Write-Output "Current SHA: ${{ github.sha }}"
        Write-Output "New commits since last preview publish: $hasNewCommitSinceLastRelease"

        if (-not $hasNewCommitSinceLastRelease)
        {
          "should-publish=false" >> $Env:GITHUB_OUTPUT
          exit 0
        }

        $assetPaths = @(
          'gulpfile.js',
          'package.json',
          'package-lock.json',
          'src/Resources/CrestApps.AI.Resources/Assets.json',
          'src/Resources/CrestApps.AI.Resources/package.json',
          'src/Resources/CrestApps.AI.Resources/Assets',
          'src/Resources/CrestApps.AI.Resources/scripts',
          'src/Resources/CrestApps.AI.Resources/wwwroot'
        )

        $changedAssetFiles = @(git diff --name-only $previousRun.head_sha '${{ github.sha }}' -- $assetPaths |
          Where-Object { -not [string]::IsNullOrWhiteSpace($_) })

        $hasAssetChangesSinceLastRelease = $changedAssetFiles.Count -gt 0
        Write-Output "Asset changes since last preview publish: $hasAssetChangesSinceLastRelease"

        if ($hasAssetChangesSinceLastRelease)
        {
          Write-Output 'Changed asset-related files:'
          $changedAssetFiles | ForEach-Object { Write-Output " - $_" }
        }

        $shouldPublish = $eventName -eq 'schedule' -and $hasAssetChangesSinceLastRelease
        "should-publish=$($shouldPublish ? 'true' : 'false')" >> $Env:GITHUB_OUTPUT

    - uses: actions/setup-node@v6
      if: steps.check-publish.outputs.should-publish == 'true'
      with:
        node-version: "20"
        # Deliberately no registry-url/scope: those make setup-node write an
        # .npmrc with `_authToken=${NODE_AUTH_TOKEN}` and export a placeholder
        # NODE_AUTH_TOKEN. npm would then treat that placeholder as credentials
        # and skip OIDC, so trusted publishing never runs. The registry comes
        # from publishConfig.registry in the package's package.json instead.

    - name: Update npm for trusted publishing
      if: steps.check-publish.outputs.should-publish == 'true'
      # npm trusted publishing (OIDC) requires npm >= 11.5.1; Node 20 ships npm 10.x.
      # Pin to the 11.x line: npm 12+ dropped Node 20 support (EBADENGINE).
      run: npm install -g npm@11

    - name: Build assets
      if: steps.check-publish.outputs.should-publish == 'true'
      run: |
        npm ci
        gulp rebuild

    - name: Publish to npm
      if: steps.check-publish.outputs.should-publish == 'true'
      working-directory: src/Resources/CrestApps.AI.Resources
      # No NODE_AUTH_TOKEN: authentication is handled by OIDC trusted publishing.
      run: |
        node -v
        npm -v
        if [ "${{ steps.check-publish.outputs.release-mode }}" = "true" ]; then
          VERSION="${{ steps.check-publish.outputs.release-version }}"
          DIST_TAG="latest"
        else
          # Offset the run number so preview versions stay ahead of the pre-merge
          # sequence. The previous per-package workflows reached 2.0.0-preview.180
          # before they were merged into this one, which reset GitHub's run_number
          # to 1. Adding 180 keeps the .N suffix monotonically increasing and above
          # the last published preview.
          VERSION="$(node -p "require('./package.json').version").$((180 + ${{ github.run_number }}))"
          DIST_TAG="preview"
        fi
        echo "Publishing ${VERSION} to the '${DIST_TAG}' dist-tag."
        npm version "${VERSION}" --no-git-tag-version --allow-same-version
        npm publish --access public --tag "${DIST_TAG}"
